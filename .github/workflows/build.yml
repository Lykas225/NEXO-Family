
name: NEXO Family Auto Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract NEXO ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" \
            ! -path "./extracted/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found!"
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

          # Extract nested ZIP files
          for i in 1 2 3 4 5; do
            INNER_ZIP=$(find extracted -type f -iname "*.zip" -print -quit)

            if [ -z "$INNER_ZIP" ]; then
              break
            fi

            echo "Found nested archive: $INNER_ZIP"

            DEST="${INNER_ZIP%.zip}_unpacked"
            mkdir -p "$DEST"
            unzip -o "$INNER_ZIP" -d "$DEST"
            rm -f "$INNER_ZIP"
          done

          # Find Android project root
          ROOT=$(find extracted -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "Android project settings file not found!"
            echo "Extracted files:"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Android project found: $ROOT"

          # Copy project into GitHub workspace
          cp -a "$ROOT"/. .

          echo "Project extracted successfully."

          # Verify Android project
          if [ ! -d "app" ]; then
            echo "Warning: app directory not found at root."
            find . -maxdepth 3 -type d
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        env:
          RAW_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RAW_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -e

          export SUPABASE_URL=$(printf '%s' "$RAW_SUPABASE_URL" | tr -d '\r\n' | xargs)
          export SUPABASE_ANON_KEY=$(printf '%s' "$RAW_SUPABASE_ANON_KEY" | tr -d '\r\n' | xargs)

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find . -type f -path "*/build/outputs/apk/*/*.apk" \
            ! -path "./extracted/*" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/NEXO-Family.apk

          echo "APK successfully prepared:"
          ls -lh output/NEXO-Family.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Family-APK
          path: output/NEXO-Family.apk
          if-no-files-found: error
