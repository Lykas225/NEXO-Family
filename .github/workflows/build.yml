name: NEXO Family Auto Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract NEXO ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found!"
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          ROOT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "settings.gradle.kts not found inside archive!"
            exit 1
          fi

          cp -a "$ROOT"/. .
          echo "Project extracted successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        env:
          RAW_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RAW_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          export SUPABASE_URL=$(printf '%s' "$RAW_SUPABASE_URL" | tr -d '\r\n' | xargs)
          export SUPABASE_ANON_KEY=$(printf '%s' "$RAW_SUPABASE_ANON_KEY" | tr -d '\r\n' | xargs)
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Family-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
