name: NEXO Family OTA Build

on:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build.yml'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project (supports nested ZIP)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' ! -path './extracted/*' -print | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo 'ZIP archive not found'; exit 1; fi
          echo "Outer archive: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted
          for pass in 1 2 3 4 5; do
            INNER=$(find extracted -type f -iname '*.zip' -print -quit)
            [ -n "$INNER" ] || break
            DEST="${INNER%.zip}_unpacked"
            mkdir -p "$DEST"
            echo "Extracting nested archive: $INNER"
            unzip -o "$INNER" -d "$DEST"
            rm -f "$INNER"
          done
          ROOT=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo 'Android project settings.gradle(.kts) not found'
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          cp -a "$ROOT"/. .
          test -f app/build.gradle.kts || test -f app/build.gradle
          echo 'Android project extracted.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo 'Missing SIGNING_KEYSTORE_BASE64 repository secret.'
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nexo-upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/nexo-upload.jks" >> "$GITHUB_ENV"

      - name: Firebase config (push)
        shell: bash
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "GOOGLE_SERVICES_JSON not set - push disabled"; exit 0; fi
          echo "$GSJ" > "$RUNNER_TEMP/gs.json"
          echo "FIREBASE_PROJECT_ID=$(jq -r '.project_info.project_id' "$RUNNER_TEMP/gs.json")" >> "$GITHUB_ENV"
          echo "FIREBASE_SENDER_ID=$(jq -r '.project_info.project_number' "$RUNNER_TEMP/gs.json")" >> "$GITHUB_ENV"
          echo "FIREBASE_APP_ID=$(jq -r '[.client[] | select(.client_info.android_client_info.package_name=="com.nexo.family")][0].client_info.mobilesdk_app_id' "$RUNNER_TEMP/gs.json")" >> "$GITHUB_ENV"
          echo "FIREBASE_API_KEY=$(jq -r '[.client[] | select(.client_info.android_client_info.package_name=="com.nexo.family")][0].api_key[0].current_key' "$RUNNER_TEMP/gs.json")" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then echo 'Cannot read versionName'; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/NEXO-Family.apk
          sha256sum output/NEXO-Family.apk | tee output/SHA256SUMS.txt

      - name: Publish GitHub Release (OTA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: NEXO Family v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            output/NEXO-Family.apk
            output/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Family-APK
          path: output/NEXO-Family.apk
          if-no-files-found: error
